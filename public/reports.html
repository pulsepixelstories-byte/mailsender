<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap">
<div class="mat-appbar">
  <h1>📑 Reports</h1>
  <p>Results of every campaign</p>
  <nav class="mat-nav">
    <a href="./">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./wizard.html">New campaign</a>
    <b>Reports</b>
    <a id="usersNav" href="./users.html" class="hidden">Users</a>
    <a href="./settings.html">Settings</a>
  </nav>
</div>
<div class="mat-card"><div id="list">Loading...</div></div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
async function load() {
  const d = await api('/api/reports');
  document.getElementById('list').innerHTML = d.reports.map(r =>
    '<div class="mat-row"><span><b>' + escapeHtml(r.name) + '</b> <span class="mat-chip ' + escapeHtml(r.status) + '">' + escapeHtml(r.status) + '</span><br/>' +
    '<span class="mat-muted">sent ' + r.sent + '/' + r.total + ', failed ' + r.failed + '</span></span>' +
    '<a class="mat-btn tonal sm" href="./report.html?id=' + r.id + '">View</a></div>').join('')
    || '<p class="mat-muted">No campaigns yet.</p>';
}
load();
</script>
</body>
</html>
