<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Settings</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen"><div class="max-w-xl mx-auto p-4">
<nav class="flex flex-wrap gap-3 text-sm my-2">
  <a href="./" class="underline text-blue-600">Home</a>
  <a href="./dashboard.html" class="underline text-blue-600">Dashboard</a>
  <a href="./wizard.html" class="underline text-blue-600">New campaign</a>
  <a href="./reports.html" class="underline text-blue-600">Reports</a>
  <a id="usersNav" href="./users.html" class="hidden underline text-blue-600">Users</a>
  <b>Settings</b>
</nav>
<h1 class="text-2xl font-bold my-2">Settings</h1>
<div class="bg-white p-4 rounded shadow">
  <label class="block text-sm font-bold">Daily sending cap (Gmail: 400, Workspace: 2000)</label>
  <input id="cap" type="number" class="border p-2 w-full rounded" />
  <label class="block text-sm font-bold mt-2">Sender name (shown in footer)</label>
  <input id="sname" class="border p-2 w-full rounded" />
  <label class="block text-sm font-bold mt-2">Default footer (opt-out line)</label>
  <input id="footer" class="border p-2 w-full rounded" />
  <button onclick="save()" class="bg-blue-600 text-white px-4 py-2 rounded mt-3">Save</button>
  <p id="msg" class="text-sm mt-1"></p>
  <p class="text-xs text-gray-500 mt-2" title="Safety tip">Lower cap = safer. Google may pause you for a day if you send too fast.</p>
</div>
<div class="bg-white p-4 rounded shadow mt-3">
  <h2 class="font-bold mb-2">Change my password</h2>
  <input id="p_cur" type="password" class="border p-2 w-full rounded mb-2" placeholder="Current password" />
  <input id="p_next" type="password" class="border p-2 w-full rounded mb-2" placeholder="New password (min 6 chars)" />
  <button onclick="changePw()" class="bg-gray-700 text-white px-4 py-2 rounded">Change password</button>
  <p id="pwmsg" class="text-sm mt-1"></p>
</div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
async function load() {
  const s = await api('/api/settings');
  document.getElementById('cap').value = s.daily_cap;
  document.getElementById('sname').value = s.sender_name;
  document.getElementById('footer').value = s.footer;
}
async function save() {
  try {
    await api('/api/settings', { method: 'POST', body: JSON.stringify({
      daily_cap: document.getElementById('cap').value,
      sender_name: document.getElementById('sname').value,
      footer: document.getElementById('footer').value }) });
    document.getElementById('msg').textContent = 'Saved!';
  } catch (e) { document.getElementById('msg').textContent = 'Failed: ' + e.message; }
}
async function changePw() {
  const m = document.getElementById('pwmsg');
  try {
    await api('/api/users/me/password', { method: 'POST', body: JSON.stringify({
      current: document.getElementById('p_cur').value,
      next: document.getElementById('p_next').value }) });
    m.textContent = 'Password changed!';
  } catch (e) { m.textContent = 'Failed: ' + e.message; }
}
load();
</script>
</body>
</html>
