<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap narrow">
<div class="mat-appbar">
  <h1>⚙️ Settings</h1>
  <p>Sending limits, sender name, password</p>
  <nav class="mat-nav">
    <a href="./">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./wizard.html">New campaign</a>
    <a href="./reports.html">Reports</a>
    <a href="./connect.html">Connect</a>
    <a id="usersNav" href="./users.html" class="hidden">Users</a>
    <b>Settings</b>
  </nav>
</div>
<div class="mat-card">
  <h2>Sending defaults</h2>
  <label class="mat-field"><span>Daily sending cap (Gmail: 400, Workspace: 2000)</span>
    <input id="cap" type="number" class="mat-input" />
  </label>
  <label class="mat-field"><span>Sender name (shown in footer)</span>
    <input id="sname" class="mat-input" />
  </label>
  <label class="mat-field"><span>Default footer (opt-out line)</span>
    <input id="footer" class="mat-input" />
  </label>
  <button onclick="save()" class="mat-btn primary">Save</button>
  <p id="msg" class="mat-msg"></p>
  <p class="mat-muted" title="Safety tip">💡 Lower cap = safer. Google may pause you for a day if you send too fast.</p>
</div>
<div class="mat-card">
  <h2>Change my password</h2>
  <label class="mat-field"><span>Current password</span>
    <input id="p_cur" type="password" class="mat-input" placeholder="Current password" />
  </label>
  <label class="mat-field"><span>New password (min 6 chars)</span>
    <input id="p_next" type="password" class="mat-input" placeholder="New password" />
  </label>
  <button onclick="changePw()" class="mat-btn tonal">Change password</button>
  <p id="pwmsg" class="mat-msg"></p>
</div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
async function load() {
  const s = await api('/api/settings');
  document.getElementById('cap').value = s.daily_cap;
  document.getElementById('sname').value = s.sender_name;
  document.getElementById('footer').value = s.footer;
}
async function save() {
  try {
    await api('/api/settings', { method: 'POST', body: JSON.stringify({
      daily_cap: document.getElementById('cap').value,
      sender_name: document.getElementById('sname').value,
      footer: document.getElementById('footer').value }) });
    document.getElementById('msg').textContent = 'Saved!';
  } catch (e) { document.getElementById('msg').textContent = 'Failed: ' + e.message; }
}
async function changePw() {
  const m = document.getElementById('pwmsg');
  try {
    await api('/api/users/me/password', { method: 'POST', body: JSON.stringify({
      current: document.getElementById('p_cur').value,
      next: document.getElementById('p_next').value }) });
    m.textContent = 'Password changed!';
  } catch (e) { m.textContent = 'Failed: ' + e.message; }
}
load();
</script>
</body>
</html>
