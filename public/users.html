<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Users</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap">
<div class="mat-appbar">
  <h1>👥 Users</h1>
  <p>Admins only — add or remove accounts</p>
  <nav class="mat-nav">
    <a href="./">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./wizard.html">New campaign</a>
    <a href="./reports.html">Reports</a>
    <a href="./connect.html">Connect</a>
    <b>Users</b>
    <a href="./settings.html">Settings</a>
    <a href="#" onclick="logoutNav();return false;">Log out</a>
</nav>
</div>
<div id="denied" class="hidden mat-err">Admins only. <a class="mat-link" href="./">Home</a></div>
<div id="box" class="hidden">
  <div class="mat-card">
    <h2>Everyone</h2>
    <div id="list">Loading...</div>
  </div>
  <div class="mat-card">
    <h2>Add user</h2>
    <label class="mat-field"><span>Name</span><input id="u_name" class="mat-input" placeholder="Name" /></label>
    <label class="mat-field"><span>Email (login name)</span><input id="u_email" class="mat-input" placeholder="Email" /></label>
    <label class="mat-field"><span>Password (min 6 chars)</span><input id="u_pass" type="password" class="mat-input" placeholder="Password" /></label>
    <label class="mat-field"><span>Role</span>
    <select id="u_role" class="mat-input">
      <option value="user">User (can use the app)</option>
      <option value="admin">Admin (can also add/remove users)</option>
    </select></label>
    <button onclick="addUser()" class="mat-btn success">Add user</button>
    <p id="msg" class="mat-msg"></p>
  </div>
</div>
</div>
<script src="./app.js"></script>
<script>
guard();
async function load() {
  try {
    const d = await api('/api/users');
    document.getElementById('box').classList.remove('hidden');
    document.getElementById('list').innerHTML = d.users.map(u =>
      '<div class="mat-row"><span><b>' + escapeHtml(u.name) + '</b> ' +
      escapeHtml(u.email) + ' <span class="mat-chip ' + (u.role === 'admin' ? 'running' : '') + '">' + escapeHtml(u.role) + '</span></span>' +
      '<button onclick="removeUser(' + u.id + ')" class="mat-btn danger sm">Remove</button></div>').join('');
  } catch (e) {
    document.getElementById('denied').classList.remove('hidden');
  }
}
async function addUser() {
  const msg = document.getElementById('msg');
  try {
    await api('/api/users', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('u_name').value,
      email: document.getElementById('u_email').value,
      password: document.getElementById('u_pass').value,
      role: document.getElementById('u_role').value }) });
    msg.textContent = 'Added!';
    load();
  } catch (e) { msg.textContent = e.message; }
}
async function removeUser(id) {
  if (!confirm('Remove this user? They will be logged out immediately.')) return;
  try { await api('/api/users/' + id, { method: 'DELETE' }); load(); }
  catch (e) { alert(e.message); }
}
load();
</script>
</body>
</html>
