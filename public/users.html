<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Users</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen"><div class="max-w-3xl mx-auto p-4">
<nav class="flex flex-wrap gap-3 text-sm my-2">
  <a href="./" class="underline text-blue-600">Home</a>
  <a href="./dashboard.html" class="underline text-blue-600">Dashboard</a>
  <a href="./wizard.html" class="underline text-blue-600">New campaign</a>
  <a href="./reports.html" class="underline text-blue-600">Reports</a>
  <a id="usersNav" href="./users.html" class="hidden underline text-blue-600">Users</a>
  <a href="./settings.html" class="underline text-blue-600">Settings</a>
</nav>
<h1 class="text-2xl font-bold my-2">Users <span class="text-sm font-normal text-gray-500">(admin only)</span></h1>
<div id="denied" class="hidden bg-red-100 p-4 rounded">Admins only. <a href="./" class="underline">Home</a></div>
<div id="box" class="hidden">
  <div class="bg-white p-4 rounded shadow mb-3">
    <h2 class="font-bold mb-2">Everyone</h2>
    <div id="list">Loading...</div>
  </div>
  <div class="bg-white p-4 rounded shadow">
    <h2 class="font-bold mb-2">Add user</h2>
    <input id="u_name" class="border p-2 w-full rounded mb-2" placeholder="Name" />
    <input id="u_email" class="border p-2 w-full rounded mb-2" placeholder="Email" />
    <input id="u_pass" type="password" class="border p-2 w-full rounded mb-2" placeholder="Password (min 6 chars)" />
    <select id="u_role" class="border p-2 w-full rounded mb-2">
      <option value="user">User (can use the app)</option>
      <option value="admin">Admin (can also add/remove users)</option>
    </select>
    <button onclick="addUser()" class="bg-green-600 text-white px-4 py-2 rounded">Add user</button>
    <p id="msg" class="text-sm mt-1"></p>
  </div>
</div>
</div>
<script src="./app.js"></script>
<script>
guard();
async function load() {
  try {
    const d = await api('/api/users');
    document.getElementById('box').classList.remove('hidden');
    document.getElementById('list').innerHTML = d.users.map(u =>
      '<div class="border-b py-2 text-sm flex justify-between items-center"><span><b>' + escapeHtml(u.name) + '</b> ' +
      escapeHtml(u.email) + ' <span class="text-xs bg-gray-200 px-2 rounded">' + escapeHtml(u.role) + '</span></span>' +
      '<button onclick="removeUser(' + u.id + ')" class="text-red-600 underline text-xs">Remove</button></div>').join('');
  } catch (e) {
    document.getElementById('denied').classList.remove('hidden');
  }
}
async function addUser() {
  const msg = document.getElementById('msg');
  try {
    await api('/api/users', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('u_name').value,
      email: document.getElementById('u_email').value,
      password: document.getElementById('u_pass').value,
      role: document.getElementById('u_role').value }) });
    msg.textContent = 'Added!';
    load();
  } catch (e) { msg.textContent = e.message; }
}
async function removeUser(id) {
  if (!confirm('Remove this user? They will be logged out immediately.')) return;
  try { await api('/api/users/' + id, { method: 'DELETE' }); load(); }
  catch (e) { alert(e.message); }
}
load();
</script>
</body>
</html>
