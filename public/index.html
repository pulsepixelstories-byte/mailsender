<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <div class="bg-white p-8 rounded shadow max-w-md mx-auto w-full mt-8">
    <h1 class="text-3xl font-bold text-center">Business Mail Sender</h1>
    <p class="text-gray-600 my-2 text-center">Log in to use the mail client.</p>

    <!-- First-run: create the admin account -->
    <div id="setupBox" class="hidden">
      <h2 class="font-bold mb-2">Create admin account (first time only)</h2>
      <input id="s_name" class="border p-2 w-full rounded mb-2" placeholder="Your name" />
      <input id="s_email" class="border p-2 w-full rounded mb-2" placeholder="Email" />
      <input id="s_pass" type="password" class="border p-2 w-full rounded mb-2" placeholder="Password (min 6 chars)" />
      <button onclick="setupAdmin()" class="bg-green-600 text-white px-4 py-2 rounded w-full">Create admin</button>
    </div>

    <!-- Normal login -->
    <div id="loginBox" class="hidden">
      <h2 class="font-bold mb-2">Log in</h2>
      <input id="l_email" class="border p-2 w-full rounded mb-2" placeholder="Email" />
      <input id="l_pass" type="password" class="border p-2 w-full rounded mb-2" placeholder="Password" />
      <button onclick="doLogin()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Log in</button>
    </div>

    <p id="msg" class="text-sm mt-2 text-center"></p>
  </div>

  <!-- Mail client: appears when THIS browser is logged in -->
  <div id="client" class="hidden max-w-md mx-auto mt-4">
    <p class="text-sm mb-2">Signed in as <b id="who"></b> (<span id="role"></span>)
      <button onclick="logout()" class="underline text-gray-600 ml-2">Log out</button>
    </p>
    <h2 class="font-bold mb-2">Mail client — what next?</h2>
    <div class="grid gap-2">
      <a href="./wizard.html" class="bg-green-600 text-white px-4 py-3 rounded text-center font-bold">+ New campaign (pick sheet → compose → send)</a>
      <a href="./dashboard.html" class="bg-white px-4 py-3 rounded shadow text-center">Dashboard <span class="text-gray-500 text-sm">(progress, today's count)</span></a>
      <a href="./reports.html" class="bg-white px-4 py-3 rounded shadow text-center">Reports <span class="text-gray-500 text-sm">(results, CSV, Drive copy)</span></a>
      <a id="usersCard" href="./users.html" class="hidden bg-white px-4 py-3 rounded shadow text-center">Users <span class="text-gray-500 text-sm">(admin: add / remove)</span></a>
    </div>
    <div id="gmailBox" class="bg-white p-4 rounded shadow mt-3 text-sm"></div>
  </div>
</div>
<script src="./app.js"></script>
<script>
async function check() {
  const msg = document.getElementById('msg');
  try {
    const s = await api('/auth/status');
    if (s.needsSetup) {
      document.getElementById('setupBox').classList.remove('hidden');
      return;
    }
    if (s.loggedIn) {
      document.getElementById('who').textContent = s.userName + ' (' + s.userEmail + ')';
      document.getElementById('role').textContent = s.role;
      document.getElementById('client').classList.remove('hidden');
      document.getElementById('loginBox').classList.add('hidden');
      if (s.role === 'admin') document.getElementById('usersCard').classList.remove('hidden');
      gmailBox(s);
    } else {
      document.getElementById('loginBox').classList.remove('hidden');
    }
  } catch (e) { msg.textContent = 'Error: ' + e.message; }
}
async function gmailBox(s) {
  const box = document.getElementById('gmailBox');
  if (!s.googleConfigured) { box.textContent = 'Google login not set up (.env keys missing).'; return; }
  box.innerHTML = s.googleConnected
    ? 'Gmail sender: <b>' + escapeHtml(s.googleEmail) + '</b>' +
      (s.role === 'admin' ? ' <button onclick="reconnect()" class="underline text-blue-600">Reconnect</button>' : '')
    : 'No Gmail sender connected yet.' +
      (s.role === 'admin' ? ' <a href="./auth/google" class="underline text-blue-600">Connect Gmail</a>' : ' (ask your admin)');
}
function reconnect() { location.href = './auth/google'; }
async function setupAdmin() {
  const msg = document.getElementById('msg');
  try {
    await api('/auth/setup-admin', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('s_name').value,
      email: document.getElementById('s_email').value,
      password: document.getElementById('s_pass').value }) });
    location.reload();
  } catch (e) { msg.textContent = e.message; }
}
async function doLogin() {
  const msg = document.getElementById('msg');
  try {
    await api('/auth/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('l_email').value,
      password: document.getElementById('l_pass').value }) });
    location.reload();
  } catch (e) { msg.textContent = e.message; }
}
async function logout() {
  await api('/auth/logout', { method: 'POST' });
  location.reload();
}
check();
</script>
</body>
</html>
