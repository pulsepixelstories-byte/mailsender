<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap narrow">
  <div class="mat-appbar" style="text-align:center">
    <div style="font-size:2.4rem">✉️</div>
    <h1>Business Mail Sender</h1>
    <p>Bulk Gmail from a Google Sheet — slowly and safely</p>
  </div>

  <div class="mat-card">
    <h2 style="text-align:center">Log in</h2>
    <form onsubmit="event.preventDefault(); doLogin();">
      <label class="mat-field"><span>Email</span>
        <input id="l_email" class="mat-input" placeholder="Email" autocomplete="username" />
      </label>
      <label class="mat-field"><span>Password</span>
        <input id="l_pass" type="password" class="mat-input" placeholder="Password" autocomplete="current-password" />
      </label>
      <button type="submit" class="mat-btn primary block">Log in</button>
    </form>
    <p id="msg" class="mat-msg" style="text-align:center"></p>
    <p class="mat-muted" style="text-align:center;margin-bottom:0">No account? Ask your admin to create one for you.</p>
  </div>
</div>
<script src="./app.js"></script>
<script>
// Landing page = login only. Already signed in? Go straight to the app.
async function check() {
  try {
    const s = await api('/auth/status');
    if (s.loggedIn) location.href = './dashboard.html';
  } catch (e) { /* stay on login, message below if needed */ }
}
async function doLogin() {
  const msg = document.getElementById('msg');
  msg.textContent = 'Signing in…';
  try {
    await api('/auth/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('l_email').value,
      password: document.getElementById('l_pass').value }) });
    location.href = './dashboard.html';
  } catch (e) { msg.textContent = e.message; }
}
check();
</script>
</body>
</html>
