<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 rounded shadow max-w-md w-full text-center">
  <h1 class="text-3xl font-bold">Business Mail Sender</h1>
  <p class="text-gray-600 my-2">Send Gmail to many people from a Google Sheet — slowly and safely.</p>
  <p id="status" class="text-sm my-3">Checking...</p>
  <a id="loginBtn" href="./auth/google" class="inline-block bg-blue-600 text-white px-6 py-3 rounded w-full">Sign in with Google</a>
  <button id="outBtn" onclick="disconnect()" class="hidden mt-2 text-sm underline text-gray-600">Disconnect</button>
  <p class="text-xs text-gray-500 mt-3">Only sends to people who agreed to receive email.</p>
</div>
<script src="./app.js"></script>
<script>
async function check() {
  const el = document.getElementById('status');
  try {
    const s = await api('/auth/status');
    if (!s.configured) { el.textContent = 'Not set up yet: ask owner to fill .env Google keys.'; return; }
    if (s.connected) {
      el.innerHTML = 'Connected as <b>' + escapeHtml(s.email) + '</b>';
      document.getElementById('loginBtn').textContent = 'Reconnect Google';
      document.getElementById('outBtn').classList.remove('hidden');
    } else el.textContent = 'Not connected. Click Sign in with Google.';
  } catch (e) { el.textContent = 'Error: ' + e.message; }
}
async function disconnect() {
  await api('/auth/disconnect', { method: 'POST' });
  check();
}
check();
</script>
</body>
</html>
