<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap">
<div class="mat-appbar">
  <h1>✅ Confirmation report</h1>
  <p>Delivery proof for one campaign</p>
  <nav class="mat-nav">
    <a href="./">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./wizard.html">New campaign</a>
    <a href="./reports.html">Reports</a>
    <a id="usersNav" href="./users.html" class="hidden">Users</a>
    <a href="./settings.html">Settings</a>
  </nav>
</div>
<div class="mat-card"><div id="box">Loading...</div></div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
const id = new URLSearchParams(location.search).get('id');
async function load() {
  const r = await api('/api/reports/' + id);
  document.getElementById('box').innerHTML =
    '<h2>' + escapeHtml(r.campaign.name) + ' <span class="mat-chip ' + escapeHtml(r.campaign.status) + '">' + escapeHtml(r.campaign.status) + '</span></h2>' +
    '<p class="mat-muted">From ' + escapeHtml(r.senderEmail) + ' | Tab ' + escapeHtml(r.campaign.sheet_tab) +
    ' | ' + escapeHtml(r.campaign.started_at || '') + ' → ' + escapeHtml(r.campaign.finished_at || '') + '</p>' +
    '<p style="margin:10px 0">Total <b>' + r.total + '</b>, sent <b style="color:var(--success)">' + r.byStatus.sent + '</b>, failed <b style="color:var(--error)">' + r.byStatus.failed + '</b>, skipped ' + r.byStatus.skipped + ', rate ' + r.successRate + '%</p>' +
    '<div class="mat-actions">' +
    '<a class="mat-btn tonal sm" href="./api/reports/' + id + '/csv">⬇ Download CSV</a>' +
    '<a class="mat-btn tonal sm" target="_blank" href="./api/reports/' + id + '/print">🖨 Print / PDF</a>' +
    '<button onclick="drive()" class="mat-btn tonal sm">💾 Save to Drive</button>' +
    '<button onclick="emailMe()" class="mat-btn tonal sm">✉ Email me summary</button>' +
    '<button onclick="retryF()" class="mat-btn primary sm">Retry failed only</button></div>' +
    '<p id="m" class="mat-msg"></p>' +
    '<h3 style="margin:14px 0 6px">Recipients</h3>' +
    r.people.slice(0, 200).map(p => '<div class="mat-row" style="font-size:0.8rem"><span>' + escapeHtml(p.email) + '</span><span class="mat-chip ' + escapeHtml(p.status) + '">' + escapeHtml(p.status) + '</span></div>').join('');
}
async function drive() { const r = await api('/api/reports/' + id + '/drive', { method: 'POST' }); document.getElementById('m').textContent = 'Saved to Drive ✓'; }
async function emailMe() { const r = await api('/api/reports/' + id + '/email', { method: 'POST' }); document.getElementById('m').textContent = 'Emailed to ' + r.to; }
async function retryF() { const r = await api('/api/reports/' + id + '/retry-failed', { method: 'POST' }); document.getElementById('m').innerHTML = 'New campaign ' + r.newId + ' created. <a class="mat-link" href="./live.html?id=' + r.newId + '">Open it →</a>'; }
load();
</script>
</body>
</html>
