<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="mat"><div class="mat-wrap">
<div class="mat-appbar">
  <h1 id="title">🚀 Live campaign</h1>
  <p>Start, watch progress, pause anytime</p>
  <nav class="mat-nav">
    <a href="./">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./wizard.html">New campaign</a>
    <a href="./reports.html">Reports</a>
    <a id="usersNav" href="./users.html" class="hidden">Users</a>
    <a href="./settings.html">Settings</a>
  </nav>
</div>
<div class="mat-card">
  <h2>Controls</h2>
  <div class="mat-actions">
    <button onclick="act('start')" class="mat-btn success">▶ Start</button>
    <button onclick="act('pause')" class="mat-btn warn">⏸ Pause</button>
    <button onclick="act('resume')" class="mat-btn primary">↻ Resume</button>
    <button onclick="act('stop')" class="mat-btn danger">■ Stop</button>
    <a id="repLink" href="#" class="mat-btn tonal">Report</a>
  </div>
  <p id="msg" class="mat-msg"></p>
  <p class="mat-muted">Launch asks for confirmation with total time first (see button below).</p>
  <button onclick="confirmLaunch()" class="mat-btn tonal sm" style="margin-top:8px">Review time &amp; confirm launch…</button>
</div>
<div class="mat-card">
  <div class="mat-progress"><div id="bar" style="width:0%"></div></div>
  <p id="counts" class="mat-muted" style="margin:8px 0 4px">Loading...</p>
  <p style="margin:0">Now: <b id="cur">—</b> &nbsp;|&nbsp; Next send in: <b id="next">—</b></p>
</div>
<div class="mat-card"><h2>Live log</h2><div id="log" class="mat-muted">Loading...</div></div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
const id = new URLSearchParams(location.search).get('id');
document.getElementById('repLink').href = './report.html?id=' + id;
async function act(a) {
  const m = document.getElementById('msg');
  try { const r = await api('/api/sends/' + id + '/' + a, { method: 'POST' }); m.textContent = 'OK: ' + r.status; poll(); }
  catch (e) { m.textContent = 'Failed: ' + e.message; }
}
async function confirmLaunch() {
  try {
    const c = await api('/api/sends/' + id + '/confirm');
    const mins = Math.round(c.etaSec / 60);
    if (confirm('Send to ' + c.pending + ' people? Mode: ' + c.mode + '. Estimated total: about ' + mins + ' min.' + (c.dry ? ' (DRY RUN - nothing sent)' : '') + '\n\nOK to launch?')) act('start');
  } catch (e) { alert(e.message); }
}
async function poll() {
  if (!id) return;
  try {
    const s = await api('/api/sends/' + id + '/status');
    document.getElementById('title').textContent = '🚀 ' + s.campaign.name + ' (' + s.campaign.status + ')';
    const done = s.counts.sent + s.counts.failed + s.counts.skipped;
    document.getElementById('bar').style.width = (s.total ? Math.round(done / s.total * 100) : 0) + '%';
    document.getElementById('counts').textContent = 'Sent ' + s.counts.sent + ' | Failed ' + s.counts.failed + ' | Pending ' + s.counts.pending + ' | Skipped ' + s.counts.skipped + ' | Total ' + s.total;
    document.getElementById('cur').textContent = s.running ? (s.current || 'starting…') : '— (not running)';
    document.getElementById('next').textContent = s.running && s.nextInSec ? s.nextInSec + 's' : '—';
    document.getElementById('log').innerHTML = s.events.map(e => '<div class="mat-row"><span><b>' + escapeHtml(e.event) + '</b> ' + escapeHtml(e.detail || '') + '</span><span class="mat-muted">' + escapeHtml(e.created_at) + '</span></div>').join('') || 'No events yet.';
  } catch (e) { /* keep old */ }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
