<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Mail Sender - Live</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen"><div class="max-w-3xl mx-auto p-4">
<nav class="flex flex-wrap gap-3 text-sm my-2">
  <a href="./" class="underline text-blue-600">Home</a>
  <a href="./dashboard.html" class="underline text-blue-600">Dashboard</a>
  <a href="./wizard.html" class="underline text-blue-600">New campaign</a>
  <a href="./reports.html" class="underline text-blue-600">Reports</a>
  <a id="usersNav" href="./users.html" class="hidden underline text-blue-600">Users</a>
  <a href="./settings.html" class="underline text-blue-600">Settings</a>
</nav>
<h1 id="title" class="text-2xl font-bold my-2">Live campaign</h1>
<div class="bg-white p-4 rounded shadow mb-3">
  <div class="flex gap-2 flex-wrap">
    <button onclick="act('start')" class="bg-green-600 text-white px-4 py-2 rounded">Start</button>
    <button onclick="act('pause')" class="bg-yellow-500 text-white px-4 py-2 rounded">Pause</button>
    <button onclick="act('resume')" class="bg-blue-600 text-white px-4 py-2 rounded">Resume</button>
    <button onclick="act('cancel')" class="bg-red-600 text-white px-4 py-2 rounded">Cancel</button>
    <a id="repLink" href="#" class="bg-gray-200 px-4 py-2 rounded">Report</a>
  </div>
  <p id="msg" class="text-sm mt-1"></p>
  <p class="text-xs text-gray-500">Launch asks for confirmation with total time first (see button below).</p>
  <button onclick="confirmLaunch()" class="mt-1 text-sm underline text-blue-600">Review time & confirm launch…</button>
</div>
<div class="bg-white p-4 rounded shadow mb-3">
  <div class="bg-gray-200 h-4 rounded"><div id="bar" class="bg-green-600 h-4 rounded" style="width:0%"></div></div>
  <p id="counts" class="text-sm mt-1">Loading...</p>
  <p class="text-sm">Now: <b id="cur">—</b> | Next send in: <b id="next">—</b></p>
</div>
<div class="bg-white p-4 rounded shadow"><h2 class="font-bold">Live log</h2><div id="log" class="text-xs space-y-1 mt-1"></div></div>
</div>
<script src="./app.js"></script>
<script>
guard(); // auth gate: redirect to login if not signed in
const id = new URLSearchParams(location.search).get('id');
document.getElementById('repLink').href = './report.html?id=' + id;
async function act(a) {
  const m = document.getElementById('msg');
  try { const r = await api('/api/sends/' + id + '/' + a, { method: 'POST' }); m.textContent = 'OK: ' + r.status; poll(); }
  catch (e) { m.textContent = 'Failed: ' + e.message; }
}
async function confirmLaunch() {
  try {
    const c = await api('/api/sends/' + id + '/confirm');
    const mins = Math.round(c.etaSec / 60);
    if (confirm('Send to ' + c.pending + ' people? Mode: ' + c.mode + '. Estimated total: about ' + mins + ' min.' + (c.dry ? ' (DRY RUN - nothing sent)' : '') + '\n\nOK to launch?')) act('start');
  } catch (e) { alert(e.message); }
}
async function poll() {
  if (!id) return;
  try {
    const s = await api('/api/sends/' + id + '/status');
    document.getElementById('title').textContent = s.campaign.name + ' (' + s.campaign.status + ')';
    const done = s.counts.sent + s.counts.failed + s.counts.skipped;
    document.getElementById('bar').style.width = (s.total ? Math.round(done / s.total * 100) : 0) + '%';
    document.getElementById('counts').textContent = 'Sent ' + s.counts.sent + ' | Failed ' + s.counts.failed + ' | Pending ' + s.counts.pending + ' | Skipped ' + s.counts.skipped + ' | Total ' + s.total;
    document.getElementById('cur').textContent = s.running ? (s.current || 'starting…') : '— (not running)';
    document.getElementById('next').textContent = s.running && s.nextInSec ? s.nextInSec + 's' : '—';
    document.getElementById('log').innerHTML = s.events.map(e => '<div class="border-b py-1"><b>' + escapeHtml(e.event) + '</b> ' + escapeHtml(e.detail || '') + ' <span class="text-gray-400">' + escapeHtml(e.created_at) + '</span></div>').join('') || '<p class="text-gray-500">No events yet.</p>';
  } catch (e) { /* keep old */ }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
